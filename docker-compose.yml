services:
  replicator:
    build:
      context: .
      dockerfile: replicator/Dockerfile
    image: cdc-replicator:latest
    container_name: cdc_replicator
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["run"]
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./.env:/app/.env:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
